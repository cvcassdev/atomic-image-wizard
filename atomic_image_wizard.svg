<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1e3a5f"/>

  <!-- Outer ring / atom orbit -->
  <ellipse cx="64" cy="64" rx="52" ry="20" fill="none" stroke="#4a90d9" stroke-width="3" opacity="0.7"/>
  <ellipse cx="64" cy="64" rx="52" ry="20" fill="none" stroke="#4a90d9" stroke-width="3" opacity="0.7"
           transform="rotate(60 64 64)"/>
  <ellipse cx="64" cy="64" rx="52" ry="20" fill="none" stroke="#4a90d9" stroke-width="3" opacity="0.7"
           transform="rotate(120 64 64)"/>

  <!-- Center nucleus -->
  <circle cx="64" cy="64" r="10" fill="#4a90d9"/>

  <!-- Container/box lines at bottom suggesting a Containerfile -->
  <rect x="38" y="88" width="52" height="22" rx="4" fill="none" stroke="#7ec8e3" stroke-width="2.5"/>
  <line x1="38" y1="96" x2="90" y2="96" stroke="#7ec8e3" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="102" x2="72" y2="102" stroke="#7ec8e3" stroke-width="1.5" opacity="0.5"/>
  <line x1="44" y1="107" x2="66" y2="107" stroke="#7ec8e3" stroke-width="1.5" opacity="0.5"/>

  <!-- Wizard wand spark top-right -->
  <line x1="88" y1="22" x2="94" y2="16" stroke="#f0c040" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="28" x2="103" y2="26" stroke="#f0c040" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="36" x2="96" y2="38" stroke="#f0c040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="86" cy="28" r="4" fill="#f0c040"/>
</svg>
